[project]
name = "promptcore"
version = "0.1.0"
description = "Shared deterministic rule engine and cloud free-tier LLM router for TextPrompt AI and VoicePrompt AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "keyring>=25.2.0",
    "filelock>=3.14.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "respx>=0.21.1",
    "ruff>=0.4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["promptcore"]

[tool.ruff]
line-length = 100
target-version = "py311"