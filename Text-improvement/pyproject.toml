[project]
name = "textprompt"
version = "1.1.0"
description = "TextPrompt AI (Cloud Free-Tier Edition) — Fast selection capture, deterministic rules, and free-tier LLM refinement"
readme = "PRD.md"
requires-python = ">=3.11"
dependencies = [
    "promptcore",
    "pywin32>=306; sys_platform == 'win32'",
    "psutil>=5.9.8",
    "pynput>=1.7.7",
    "symspellpy>=6.7.7",
    "watchdog>=4.0.1",
    "pystray>=0.19.5",
    "pillow>=10.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "respx>=0.21.1",
    "rapidfuzz>=3.9.0",
    "ruff>=0.4.4",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
]

[project.scripts]
textprompt = "textprompt.main:main"

[tool.uv.sources]
promptcore = { path = "../promptcore", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["textprompt"]

[tool.ruff]
line-length = 100
target-version = "py311"